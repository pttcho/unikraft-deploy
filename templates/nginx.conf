worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 300s;
    server_tokens off;

    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # 8080/8081: 平台网关从私有 IP 访问 -> 通配绑定
    # 127.0.0.1:8090: cloudflared 从 loopback 访问 -> 必须显式绑 127.0.0.1
    #   （本 unikernel 网络栈下 0.0.0.0 通配绑定收不到 loopback 连接）
    server {
        listen 8080 default_server;
        listen 8081 default_server;
        listen 127.0.0.1:8090;
        server_name _;

        # ---- 代理入口 1: VLESS over WebSocket ----
        location = /api/v2/stream {
            proxy_pass http://127.0.0.1:18080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---- 代理入口 2: VLESS over HTTPUpgrade ----
        location = /cdn/v1/sync {
            proxy_pass http://127.0.0.1:18081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---- 其他一切 -> 伪装站点 ----
        location / {
            root /var/www/decoy;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}