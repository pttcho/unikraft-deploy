name: Proxy Node Maintenance
run-name: Proxy maintenance ${{ inputs.phase }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Scoped maintenance phase'
        type: choice
        required: true
        default: inspect
        options:
          - inspect
          - apply
          - repair-diagnostics
          - rebuild-was
      confirmation:
        description: 'Apply requires FRA-TO-WAS-ALL-4096; inspect leaves empty'
        type: string
        required: false
      request_id:
        description: 'Unique request ID; no credentials'
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: proxy-node-maintenance
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        account: [primary, secondary]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read-only preflight
        env:
          ACCOUNT: ${{ matrix.account }}
          UNIKRAFT_TOKEN: ${{ matrix.account == 'secondary' && secrets.UNIKRAFT_TOKEN_2 || secrets.UNIKRAFT_TOKEN }}
        run: python3 scripts/maintenance-inspect.py


  resize-primary:
    if: inputs.phase == 'apply'
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Rolling resize of SFO then SIN
        env:
          ACCOUNT: primary
          ACTION: resize-primary
          CONFIRM: ${{ inputs.confirmation }}
          UNIKRAFT_TOKEN: ${{ secrets.UNIKRAFT_TOKEN }}
        run: python3 scripts/maintenance-apply.py

  migrate-secondary:
    needs: resize-primary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Opaque-image FRA to WAS migration
        env:
          ACCOUNT: secondary
          ACTION: migrate-secondary
          CONFIRM: ${{ inputs.confirmation }}
          UNIKRAFT_TOKEN: ${{ secrets.UNIKRAFT_TOKEN_2 }}
        run: python3 scripts/maintenance-apply.py

  resize-secondary:
    needs: migrate-secondary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Resize DAL after WAS has recovered
        env:
          ACCOUNT: secondary
          ACTION: resize-secondary
          CONFIRM: ${{ inputs.confirmation }}
          UNIKRAFT_TOKEN: ${{ secrets.UNIKRAFT_TOKEN_2 }}
        run: python3 scripts/maintenance-apply.py

  verify:
    needs: resize-secondary
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        account: [primary, secondary]
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact running resources and both public entrances
        env:
          ACCOUNT: ${{ matrix.account }}
          ACTION: verify
          UNIKRAFT_TOKEN: ${{ matrix.account == 'secondary' && secrets.UNIKRAFT_TOKEN_2 || secrets.UNIKRAFT_TOKEN }}
        run: python3 scripts/maintenance-apply.py


  repair-diagnostics:
    if: inputs.phase == 'repair-diagnostics'
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Complete independently authorized DAL 4GiB resize
        env:
          ACCOUNT: secondary
          ACTION: resize-secondary
          CONFIRM: ${{ inputs.confirmation }}
          UNIKRAFT_TOKEN: ${{ secrets.UNIKRAFT_TOKEN_2 }}
        run: python3 scripts/maintenance-apply.py
      - name: Install official CLI for registry diagnostics
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl python3-yaml
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo curl -fsSL --retry 3 -o /etc/apt/keyrings/unikraft-cli.gpg https://pkg.unikraft.com/debian/cli-apt/keys/cli-apt.gpg
          sudo tee /etc/apt/sources.list.d/unikraft-cli.sources >/dev/null <<EOF
          Types: deb
          URIs: https://pkg.unikraft.com/debian/cli-apt/
          Suites: $(. /etc/os-release && echo "$VERSION_CODENAME")
          Components: stable
          Signed-By: /etc/apt/keyrings/unikraft-cli.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y unikraft-cli
      - name: Login without exposing credentials
        env:
          UNIKRAFT_TOKEN: ${{ secrets.UNIKRAFT_TOKEN_2 }}
        run: echo "$UNIKRAFT_TOKEN" | unikraft login --token -
      - name: Read supported image commands and profile keys only
        run: |
          unikraft images --help || true
          unikraft image --help || true
          unikraft run --help
          python3 scripts/registry-diagnose.py


  rebuild-was:
    if: inputs.phase == 'rebuild-was'
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install official CLI for a new immutable migration image
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl python3-yaml
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo curl -fsSL --retry 3 -o /etc/apt/keyrings/unikraft-cli.gpg https://pkg.unikraft.com/debian/cli-apt/keys/cli-apt.gpg
          sudo tee /etc/apt/sources.list.d/unikraft-cli.sources >/dev/null <<EOF
          Types: deb
          URIs: https://pkg.unikraft.com/debian/cli-apt/
          Suites: $(. /etc/os-release && echo "$VERSION_CODENAME")
          Components: stable
          Signed-By: /etc/apt/keyrings/unikraft-cli.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y unikraft-cli
      - name: Login to the user-owned image namespace
        env:
          UNIKRAFT_TOKEN: ${{ secrets.UNIKRAFT_TOKEN_2 }}
        run: echo "$UNIKRAFT_TOKEN" | unikraft login --token -
      - name: Recover only the exact FRA deployment input inside CI
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: python3 scripts/recover-fra-config.py
      - name: Prepare the same tunnel and build a dedicated WAS image
        env:
          UUID: ${{ secrets.UUID }}
          ARGO_DOMAIN: ${{ env.RECOVERED_FRA_DOMAIN }}
          ARGO_TOKEN: ${{ env.RECOVERED_FRA_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/prepare-config.sh "$UUID" "$ARGO_DOMAIN" "$ARGO_TOKEN"
          unikraft build . --output qilonglin/unikraft:was-migration-20260930
      - name: Bind only the stopped WAS candidate to the verified image
        env:
          ACCOUNT: secondary
          ACTION: migrate-secondary
          UNIKRAFT_TOKEN: ${{ secrets.UNIKRAFT_TOKEN_2 }}
        run: python3 scripts/prepare-was-image.py
      - name: Cut over with immediate rollback on preboot failure
        env:
          ACCOUNT: secondary
          ACTION: migrate-secondary
          CONFIRM: ${{ inputs.confirmation }}
          UNIKRAFT_TOKEN: ${{ secrets.UNIKRAFT_TOKEN_2 }}
        run: python3 scripts/maintenance-apply.py
      - name: Verify WAS and DAL actual running resources
        env:
          ACCOUNT: secondary
          ACTION: verify
          UNIKRAFT_TOKEN: ${{ secrets.UNIKRAFT_TOKEN_2 }}
        run: python3 scripts/maintenance-apply.py
