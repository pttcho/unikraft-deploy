name: Proxy Node Maintenance
run-name: Proxy maintenance ${{ inputs.phase }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Scoped maintenance phase'
        type: choice
        required: true
        default: inspect
        options:
          - inspect
          - apply
      confirmation:
        description: 'Apply requires FRA-TO-WAS-ALL-4096; inspect leaves empty'
        type: string
        required: false
      request_id:
        description: 'Unique request ID; no credentials'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: proxy-node-maintenance
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        account: [primary, secondary]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read-only preflight
        env:
          ACCOUNT: ${{ matrix.account }}
          UNIKRAFT_TOKEN: ${{ matrix.account == 'secondary' && secrets.UNIKRAFT_TOKEN_2 || secrets.UNIKRAFT_TOKEN }}
        run: python3 scripts/maintenance-inspect.py


  resize-primary:
    if: inputs.phase == 'apply'
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Rolling resize of SFO then SIN
        env:
          ACCOUNT: primary
          ACTION: resize-primary
          CONFIRM: ${{ inputs.confirmation }}
          UNIKRAFT_TOKEN: ${{ secrets.UNIKRAFT_TOKEN }}
        run: python3 scripts/maintenance-apply.py

  migrate-secondary:
    needs: resize-primary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Opaque-image FRA to WAS migration
        env:
          ACCOUNT: secondary
          ACTION: migrate-secondary
          CONFIRM: ${{ inputs.confirmation }}
          UNIKRAFT_TOKEN: ${{ secrets.UNIKRAFT_TOKEN_2 }}
        run: python3 scripts/maintenance-apply.py

  resize-secondary:
    needs: migrate-secondary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Resize DAL after WAS has recovered
        env:
          ACCOUNT: secondary
          ACTION: resize-secondary
          CONFIRM: ${{ inputs.confirmation }}
          UNIKRAFT_TOKEN: ${{ secrets.UNIKRAFT_TOKEN_2 }}
        run: python3 scripts/maintenance-apply.py

  verify:
    needs: resize-secondary
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        account: [primary, secondary]
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact running resources and both public entrances
        env:
          ACCOUNT: ${{ matrix.account }}
          ACTION: verify
          UNIKRAFT_TOKEN: ${{ matrix.account == 'secondary' && secrets.UNIKRAFT_TOKEN_2 || secrets.UNIKRAFT_TOKEN }}
        run: python3 scripts/maintenance-apply.py
