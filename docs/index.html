<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unikraft 订阅解密</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4f;
      --text: #e7edf6;
      --muted: #93a4bb;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --ok: #22c55e;
      --err: #ef4444;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --border: #d8e0ea;
        --text: #111827;
        --muted: #64748b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 45%);
      color: var(--text);
      line-height: 1.5;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 2rem 1rem 3rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.6rem;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 1.5rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }
    .hint {
      color: var(--muted);
      font-size: 0.875rem;
      margin: -0.2rem 0 0.6rem;
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      padding: 0.65rem 0.75rem;
      font: inherit;
    }
    textarea {
      min-height: 110px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.875rem;
    }
    button {
      margin-top: 0.75rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      padding: 0.65rem 1rem;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      margin-top: 0.75rem;
      font-size: 0.9rem;
    }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    footer {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Unikraft 订阅解密</h1>
    <p class="subtitle">完全在浏览器本地解密，不会上传 UUID 或订阅内容。</p>

    <div class="card">
      <label for="payload">加密 Payload</label>
      <p class="hint">从 GitHub Actions 日志或链接参数 <code>?payload=...</code> 自动填入。</p>
      <textarea id="payload" placeholder="IV:Base64Ciphertext"></textarea>
    </div>

    <div class="card">
      <label for="uuid">UUID（解密密钥）</label>
      <p class="hint">与部署时配置的 UUID 相同，用于 SHA-256 派生 AES-256 密钥。</p>
      <input id="uuid" type="password" autocomplete="off" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
    </div>

    <button id="decrypt" type="button">解密订阅</button>
    <div id="status" class="status" aria-live="polite"></div>

    <div class="card" style="margin-top: 1rem;">
      <label for="result">订阅内容</label>
      <textarea id="result" readonly placeholder="解密结果将显示在这里"></textarea>
    </div>

    <footer>
      算法：SHA-256(UUID) → AES-256-CBC（PKCS#7），Payload 格式 <code>IV_HEX:BASE64_CIPHERTEXT</code>。
    </footer>
  </main>

  <script>
    const payloadEl = document.getElementById("payload");
    const uuidEl = document.getElementById("uuid");
    const resultEl = document.getElementById("result");
    const statusEl = document.getElementById("status");
    const decryptBtn = document.getElementById("decrypt");

    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = "status" + (type ? " " + type : "");
    }

    function hexToBytes(hex) {
      if (!/^[0-9a-fA-F]+$/.test(hex) || hex.length % 2 !== 0) {
        throw new Error("IV 必须是偶数长度的十六进制字符串");
      }
      const out = new Uint8Array(hex.length / 2);
      for (let i = 0; i < out.length; i += 1) {
        out[i] = parseInt(hex.slice(i * 2, i * 2 + 2), 16);
      }
      return out;
    }

    function base64ToBytes(b64) {
      const normalized = b64.replace(/\s+/g, "");
      const binary = atob(normalized);
      const out = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) {
        out[i] = binary.charCodeAt(i);
      }
      return out;
    }

    async function deriveAesKey(uuid) {
      const encoded = new TextEncoder().encode(uuid);
      const digest = await crypto.subtle.digest("SHA-256", encoded);
      return crypto.subtle.importKey("raw", digest, { name: "AES-CBC" }, false, ["decrypt"]);
    }

    async function decryptPayload(uuid, payload) {
      const separator = payload.indexOf(":");
      if (separator <= 0) {
        throw new Error("Payload 格式无效，应为 IV_HEX:BASE64_CIPHERTEXT");
      }
      const ivHex = payload.slice(0, separator).trim();
      const ciphertextB64 = payload.slice(separator + 1).trim();
      if (!ivHex || !ciphertextB64) {
        throw new Error("Payload 缺少 IV 或密文");
      }

      const key = await deriveAesKey(uuid);
      const iv = hexToBytes(ivHex);
      const ciphertext = base64ToBytes(ciphertextB64);
      const plaintext = await crypto.subtle.decrypt({ name: "AES-CBC", iv }, key, ciphertext);
      return new TextDecoder().decode(plaintext);
    }

    function loadPayloadFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const payload = params.get("payload");
      if (payload) {
        payloadEl.value = payload;
      }
    }

    decryptBtn.addEventListener("click", async () => {
      const uuid = uuidEl.value.trim();
      const payload = payloadEl.value.trim();
      resultEl.value = "";
      setStatus("");

      if (!payload) {
        setStatus("请输入或确认加密 Payload。", "err");
        return;
      }
      if (!uuid) {
        setStatus("请输入 UUID。", "err");
        return;
      }

      decryptBtn.disabled = true;
      try {
        const text = await decryptPayload(uuid, payload);
        resultEl.value = text;
        setStatus("解密成功。", "ok");
      } catch (error) {
        setStatus(error instanceof Error ? error.message : "解密失败，请检查 UUID 与 Payload。", "err");
      } finally {
        decryptBtn.disabled = false;
      }
    });

    loadPayloadFromUrl();
  </script>
</body>
</html>
